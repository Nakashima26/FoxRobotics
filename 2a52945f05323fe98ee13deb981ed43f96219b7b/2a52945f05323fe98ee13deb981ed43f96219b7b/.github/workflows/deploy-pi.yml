name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions
          ssh-keyscan -H ${{ secrets.PI_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Pull latest changes
        run: |
          ssh -i ~/.ssh/github_actions ${{ secrets.PI_USER }}@${{ secrets.PI_HOST }} \
            "cd /home/user/FoxRobotics && git pull origin main"

      - name: Restart services
        run: |
          ssh -i ~/.ssh/github_actions ${{ secrets.PI_USER }}@${{ secrets.PI_HOST }} \
            "sudo systemctl restart wro-vnc.service && sudo systemctl restart wro-runtime.service"

      - name: Verify services
        run: |
          ssh -i ~/.ssh/github_actions ${{ secrets.PI_USER }}@${{ secrets.PI_HOST }} \
            "sudo systemctl status wro-vnc.service && sudo systemctl status wro-runtime.service"

      - name: Notify deployment
        if: success()
        run: echo "✅ Deployment successful to Pi at ${{ secrets.PI_HOST }}"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed"
